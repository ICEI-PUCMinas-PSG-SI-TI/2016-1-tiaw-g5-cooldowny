<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="card">
        <h1>Cadastro</h1>
        <form id="formCadastro">
            <div class="input-box"><i class="fa-solid fa-id-card"></i><input type="text" id="nome" placeholder="Nome Completo" required autocomplete="off"></div>
            <div class="input-box"><i class="fa-solid fa-envelope"></i><input type="email" id="email" placeholder="E-mail" required autocomplete="off"></div>
            <div class="input-box"><i class="fa-solid fa-lock"></i><input type="password" id="senha" placeholder="Senha" required></div>
            <div class="input-box"><i class="fa-solid fa-lock"></i><input type="password" id="confirmar" placeholder="Confirmar senha" required></div>
            
            <p class="terms">Ao cadastrar-se, você concorda com os nossos <br> <strong>Termos de Uso</strong> e <strong>Política de Privacidade</strong></p>
            
            <button type="submit" class="btn">Cadastrar-se</button>
            <p class="link">Já tem conta? <a href="login.html">Faça Login</a></p>
        </form>
    </div>

    <script>
        const form = document.getElementById('formCadastro');

        form.onsubmit = function(event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const confirmar = document.getElementById('confirmar').value;

            if (senha !== confirmar) {
                alert("As senhas não coincidem!");
                return;
            }

            const novoUsuario = { nome, email, senha };

            fetch('http://localhost:3000/usuarios', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(novoUsuario)
            })
            .then(resposta => {
                if (!resposta.ok) throw new Error('Erro ao salvar');
                return resposta.json();
            })
            .then(usuarioSalvo => {
                const usuarioLogado = { nome: usuarioSalvo.nome, email: usuarioSalvo.email, id: usuarioSalvo.id };
                localStorage.setItem('usuarioLogado', JSON.stringify(usuarioLogado));
                alert("Cadastrado com sucesso!");
                window.location.href = "inicio.html";
            })
            .catch(erro => {
                alert("Erro ao salvar o usuário. Verifique se o json-server está rodando (npm run server).");
                console.error(erro);
            });
        };
    </script>
</body>
</html>
