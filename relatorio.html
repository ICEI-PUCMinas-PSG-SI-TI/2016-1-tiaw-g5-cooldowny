<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoolDowny - Relatórios e Estatísticas</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f0d0b; 
            color: #ffffff; 
            padding: 20px; 
            margin: 0;
        }
        
        .container { 
            max-width: 900px; 
            margin: 40px auto; 
        }

        h1 {
            font-family: Georgia, serif;
            color: #ffffff;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #a19584;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        /* Grid de Cards de Destaque */
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: #181512;
            border: 1px solid #332d26;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .card h3 {
            margin: 0 0 10px 0;
            color: #a19584;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card .valor {
            font-size: 2rem;
            font-family: monospace;
            color: #cca010;
            font-weight: bold;
        }

        .card .valor.alerta {
            color: #ff4a4a;
        }

        .bloco { 
            background-color: #181512; 
            padding: 30px; 
            border-radius: 8px; 
            border: 1px solid #332d26;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        
        h2 { 
            font-family: Georgia, serif;
            color: #cca010; 
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* Estilização da Tabela */
        .tabela-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #332d26;
        }

        th {
            background-color: #211d19;
            color: #cca010;
            font-weight: 600;
        }

        tr:hover {
            background-color: #1f1b17;
        }

        .badge-humor {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .humor-Feliz { background-color: #2e7d32; color: #fff; }
        .humor-Ansioso { background-color: #ef6c00; color: #fff; }
        .humor-Cansado { background-color: #455a64; color: #fff; }
        .humor-Estressado { background-color: #c62828; color: #fff; }

        .texto-excedido {
            color: #ff4a4a;
            font-weight: bold;
        }

        .btn-voltar {
            font-family: 'Segoe UI', sans-serif;
            padding: 12px 24px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            border: none;
            font-size: 1rem;
            background-color: #5a5247;
            color: #ffffff;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s ease;
        }

        .btn-voltar:hover {
            background-color: #72685b;
        }

        .sem-dados {
            text-align: center;
            color: #5a5247;
            padding: 40px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Painel de Controle CoolDowny</h1>
    <div class="subtitulo">Acompanhamento e análise de tempo de jogo</div>

    <div class="dashboard-cards">
        <div class="card">
            <h3>Total de Jogatinas</h3>
            <div class="valor" id="metric-total-sessoes">0</div>
        </div>
        <div class="card">
            <h3>Tempo Total</h3>
            <div class="valor" id="metric-tempo-total">00:00:00</div>
        </div>
        <div class="card">
            <h3>Tempo Excedido</h3>
            <div class="valor alerta" id="metric-tempo-excedido">00:00:00</div>
        </div>
        <div class="card">
            <h3>Humor Crítico</h3>
            <div class="valor" id="metric-humor-comum">-</div>
        </div>
    </div>

    <div class="bloco">
        <h2>Histórico de Sessões</h2>
        
        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Jogo</th>
                        <th>Humor Inicial</th>
                        <th>Tempo Total</th>
                        <th>Tempo Excedido</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
            <div id="mensagem-vazia" class="sem-dados" style="display: none;">
                Nenhuma jogatina registrada até o momento.
            </div>
        </div>
    </div>

    <a href="index.html" class="btn-voltar">← Voltar ao Cronômetro</a>
</div>

<script>
    const URL_API = 'http://localhost:3000/sessoes';

    window.onload = () => {
        carregarRelatorios();
    };

    function carregarRelatorios() {
        fetch(URL_API)
            .then(resposta => resposta.json())
            .then(dados => {
                renderizarDashboard(dados);
            })
            .catch(erro => {
                console.error("Erro ao carregar dados:", erro);
                document.getElementById('mensagem-vazia').innerText = "Erro ao conectar com o servidor do banco de dados.";
                document.getElementById('mensagem-vazia').style.display = "block";
            });
    }

    function converterSegundosParaTexto(totalSegundos) {
        let horas = Math.floor(totalSegundos / 3600);
        let minutos = Math.floor((totalSegundos % 3600) / 60);
        let segundos = totalSegundos % 60;

        if (horas < 10) horas = "0" + horas;
        if (minutos < 10) minutos = "0" + minutos;
        if (segundos < 10) segundos = "0" + segundos;

        return horas + ":" + minutos + ":" + segundos;
    }

    function renderizarDashboard(sessoes) {
        const corpoTabela = document.getElementById('tabela-corpo');
        const msgVazia = document.getElementById('mensagem-vazia');
        
        corpoTabela.innerHTML = "";

        if (!sessoes || sessoes.length === 0) {
            msgVazia.style.display = "block";
            return;
        } else {
            msgVazia.style.display = "none";
        }

        let totalSegundos = 0;
        let totalExcedido = 0;
        let contagemHumor = {};

        sessoes.forEach(sessao => {
            totalSegundos += sessao.tempo || 0;
            totalExcedido += sessao.tempoExcedido || 0;

            if(sessao.humor) {
                contagemHumor[sessao.humor] = (contagemHumor[sessao.humor] || 0) + 1;
            }

            const tr = document.createElement('tr');

            const txtExcedido = sessao.tempoExcedido > 0 
                ? `<span class="texto-excedido">${converterSegundosParaTexto(sessao.tempoExcedido)}</span>`
                : `<span>00:00:00</span>`;

            tr.innerHTML = `
                <td><strong>${sessao.jogo}</strong></td>
                <td><span class="badge-humor humor-${sessao.humor}">${sessao.humor}</span></td>
                <td>${converterSegundosParaTexto(sessao.tempo)}</td>
                <td>${txtExcedido}</td>
            `;

            corpoTabela.appendChild(tr);
        });

        document.getElementById('metric-total-sessoes').innerText = sessoes.length;
        document.getElementById('metric-tempo-total').innerText = converterSegundosParaTexto(totalSegundos);
        document.getElementById('metric-tempo-excedido').innerText = converterSegundosParaTexto(totalExcedido);

        let humorMaisComum = "-";
        let maiorContagem = 0;
        for (const humor in contagemHumor) {
            if (contagemHumor[humor] > maiorContagem) {
                maiorContagem = contagemHumor[humor];
                humorMaisComum = humor;
            }
        }
        document.getElementById('metric-humor-comum').innerText = humorMaisComum;
    }
</script>
</body>
</html>
