<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronômetro - CoolDowny</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #120F0E;
        }
        .display {
            font-family: monospace;
            color: #f59e0b;
            transition: color 0.3s;
        }
        .display.excedido {
            color: #ef4444;
        }
        input, select {
            background-color: #211d19;
            color: #e0e0e0;
            border: 1px solid #332d26;
            border-radius: 6px;
            padding: 10px 12px;
            width: 100%;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input::placeholder { color: #5a5247; }
        select option { background-color: #211d19; }
    </style>
</head>
<body class="text-gray-300 flex min-h-screen">

    <aside class="w-64 bg-[#0A0807] border-r border-zinc-800 flex flex-col justify-between p-6 shrink-0 min-h-screen">
        <div>
            <div class="flex items-center gap-2 mb-10">
                <img src="image.png" alt="Logo" class="w-15 h-12">
                <div>
                    <h1 class="text-orange-400 font-bold text-sm leading-tight">CoolDowny</h1>
                    <p class="text-[10px] text-zinc-500">Equilíbrio Digital</p>
                </div>
            </div>
            <nav class="space-y-4">
                <a href="inicio.html" class="flex items-center gap-3 hover:text-orange-400 transition"><i data-lucide="home" class="w-5 h-5 text-zinc-400"></i> Início</a>
                <a href="painel.html" class="flex items-center gap-3 hover:text-orange-400 transition"><i data-lucide="layout-dashboard" class="w-5 h-5 text-zinc-400"></i> Painel</a>
                <a href="cronometro.html" class="flex items-center gap-3 text-orange-400 font-medium transition"><i data-lucide="timer" class="w-5 h-5 text-orange-400"></i> Cronômetro</a>
                <a href="tarefas.html" class="flex items-center gap-3 hover:text-orange-400 transition"><i data-lucide="list-todo" class="w-5 h-5 text-zinc-400"></i> Tarefas</a>
                <a href="#" class="flex items-center gap-3 hover:text-orange-400 transition"><i data-lucide="bar-chart-3" class="w-5 h-5 text-zinc-400"></i> Relatórios</a>
            </nav>
        </div>
        <div class="border-t border-zinc-800 pt-4">
            <a id="loginLink" href="login.html" class="flex items-center gap-3 font-semibold text-white hover:text-orange-400 transition">
                <i data-lucide="user" class="w-6 h-6 p-1 bg-zinc-800 rounded-full"></i> Login
            </a>
        </div>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
        <div class="max-w-xl mx-auto">
            <div class="mb-8">
                <h1 class="text-4xl font-bold text-white mb-2">Cronômetro</h1>
                <p class="text-zinc-400">Registre sua sessão de jogo com consciência</p>
            </div>

            <div class="bg-[#1A1615] border border-zinc-800 rounded-2xl p-8">
                <h2 class="text-xl font-bold text-amber-400 mb-6">Nova Jogatina</h2>

                <div class="mb-5">
                    <label class="block text-white font-medium mb-2">Nome do Jogo</label>
                    <input type="text" id="input-jogo" placeholder="Ex: Minecraft, Valorant">
                </div>

                <div class="mb-5">
                    <label class="block text-white font-medium mb-2">Humor Antes de Jogar</label>
                    <select id="select-humor">
                        <option value="">Escolha...</option>
                        <option value="Feliz">Feliz / Relaxado</option>
                        <option value="Ansioso">Ansioso</option>
                        <option value="Cansado">Cansado</option>
                        <option value="Estressado">Estressado</option>
                    </select>
                </div>

                <div class="mb-8">
                    <label class="block text-white font-medium mb-2">Limite de Tempo (minutos)</label>
                    <input type="number" id="input-limite" min="1" placeholder="Ex: 30, 60">
                </div>

                <div class="text-center border-t border-zinc-700 pt-8">
                    <div class="display text-7xl font-bold mb-6" id="display-tempo">00:00:00</div>
                    <div class="flex justify-center gap-3 flex-wrap">
                        <button onclick="iniciarCronometro()" class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-6 py-3 rounded-xl transition cursor-pointer">
                            ▶ Iniciar
                        </button>
                        <button onclick="pausarCronometro()" class="bg-zinc-700 hover:bg-zinc-600 text-white font-bold px-6 py-3 rounded-xl transition cursor-pointer">
                            ⏸ Pausar
                        </button>
                        <button onclick="salvarSessao()" class="bg-green-600 hover:bg-green-500 text-white font-bold px-6 py-3 rounded-xl transition cursor-pointer">
                            ✓ Finalizar e Salvar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Histórico do dia -->
            <div class="bg-[#1A1615] border border-zinc-800 rounded-2xl p-6 mt-6">
                <h2 class="text-lg font-bold text-white mb-4">Sessões Salvas Hoje</h2>
                <div id="historico-hoje" class="space-y-3">
                    <p class="text-zinc-500 text-sm text-center py-4">Carregando...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/inicial.js"></script>
    <script>
        const URL_SESSOES = 'http://localhost:3000/cronometro';

        let segundosContados = 0;
        let segundosExcedidos = 0;
        let intervaloDoTimer = null;
        let alertaDisparado = false;

        function iniciarCronometro() {
            if (intervaloDoTimer !== null) return;

            intervaloDoTimer = setInterval(function () {
                segundosContados++;

                const limiteMinutos = document.getElementById('input-limite').value;
                if (limiteMinutos) {
                    const limiteSegundos = limiteMinutos * 60;
                    if (segundosContados > limiteSegundos) {
                        segundosExcedidos++;
                        document.getElementById('display-tempo').classList.add('excedido');

                        if (!alertaDisparado) {
                            alertaDisparado = true;
                            try {
                                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                                let osc = audioCtx.createOscillator();
                                osc.connect(audioCtx.destination);
                                osc.start();
                                osc.stop(audioCtx.currentTime + 0.5);
                            } catch (e) {}
                            setTimeout(() => {
                                alert("Alerta: Você atingiu o limite de tempo estipulado!");
                            }, 10);
                        }
                    }
                }

                document.getElementById('display-tempo').innerText = converterSegundos(segundosContados);
            }, 1000);
        }

        function pausarCronometro() {
            clearInterval(intervaloDoTimer);
            intervaloDoTimer = null;
        }

        function converterSegundos(total) {
            let h = Math.floor(total / 3600);
            let m = Math.floor((total % 3600) / 60);
            let s = total % 60;
            return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        function salvarSessao() {
            const nomeJogo = document.getElementById('input-jogo').value.trim();
            const humor = document.getElementById('select-humor').value;

            if (!nomeJogo) { alert('Preencha o nome do jogo antes de salvar.'); return; }
            if (!humor) { alert('Selecione seu humor antes de salvar.'); return; }
            if (segundosContados === 0) { alert('Inicie o cronômetro antes de salvar.'); return; }

            pausarCronometro();

            // Guarda a data de hoje para o painel filtrar por dia
            const hoje = new Date();
            const dataHoje = hoje.toISOString().split('T')[0]; // "YYYY-MM-DD"

            const usuario = JSON.parse(localStorage.getItem('usuarioLogado'));
            if (!usuario) {
                alert('Você precisa estar logado para salvar uma sessão.');
                window.location.href = 'login.html';
                return;
            }

            const novaJogatina = {
                jogo: nomeJogo,
                humor: humor,
                tempo: segundosContados,
                tempoExcedido: segundosExcedidos,
                data: dataHoje,
                usuarioId: usuario.id
            };

            fetch(URL_SESSOES, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(novaJogatina)
            })
            .then(res => {
                if (!res.ok) throw new Error();
                alert('Jogatina salva com sucesso! ✅');
                resetar();
                carregarHistoricoHoje();
            })
            .catch(() => {
                alert('Erro ao salvar. Verifique se o JSON Server está rodando.');
            });
        }

        function resetar() {
            segundosContados = 0;
            segundosExcedidos = 0;
            alertaDisparado = false;
            document.getElementById('display-tempo').classList.remove('excedido');
            document.getElementById('display-tempo').innerText = '00:00:00';
            document.getElementById('input-jogo').value = '';
            document.getElementById('select-humor').value = '';
            document.getElementById('input-limite').value = '';
        }

        function carregarHistoricoHoje() {
            const hoje = new Date().toISOString().split('T')[0];
            const usuario = JSON.parse(localStorage.getItem('usuarioLogado'));
            const uid = usuario ? usuario.id : null;
            fetch(`${URL_SESSOES}?usuarioId=${uid}`)
                .then(r => r.json())
                .then(sessoes => {
                    const deHoje = sessoes.filter(s => s.data === hoje);
                    const el = document.getElementById('historico-hoje');

                    if (deHoje.length === 0) {
                        el.innerHTML = '<p class="text-zinc-500 text-sm text-center py-4">Nenhuma sessão salva hoje.</p>';
                        return;
                    }

                    el.innerHTML = deHoje.map(s => {
                        const h = Math.floor(s.tempo / 3600);
                        const m = Math.floor((s.tempo % 3600) / 60);
                        const excedeu = s.tempoExcedido > 0;
                        return `
                        <div class="flex items-center justify-between bg-zinc-900 rounded-xl px-4 py-3">
                            <div>
                                <p class="text-white font-medium">${s.jogo}</p>
                                <p class="text-zinc-500 text-xs">Humor: ${s.humor}</p>
                            </div>
                            <div class="text-right">
                                <p class="font-bold ${excedeu ? 'text-red-400' : 'text-amber-400'}">${h}h ${m}m</p>
                                ${excedeu ? `<p class="text-red-500 text-xs">+${Math.floor(s.tempoExcedido/60)}m excedido</p>` : ''}
                            </div>
                        </div>`;
                    }).join('');
                })
                .catch(() => {
                    document.getElementById('historico-hoje').innerHTML = '<p class="text-red-400 text-sm">Erro ao carregar. JSON Server rodando?</p>';
                });
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarHistoricoHoje();
        });
    </script>
</body>
</html>
