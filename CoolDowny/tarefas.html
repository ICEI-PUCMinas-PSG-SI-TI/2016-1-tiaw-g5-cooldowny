<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas - CoolDowny</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #120F0E; }
        input[type="text"] {
            background-color: #211d19;
            color: #e0e0e0;
            border: 1px solid #332d26;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 1rem;
            outline: none;
            flex: 1;
        }
        input[type="text"]::placeholder { color: #5a5247; }
        .concluida { text-decoration: line-through; color: #6b7280; }
    </style>
</head>
<body class="text-gray-300 flex min-h-screen">

    <aside class="w-64 bg-[#0A0807] border-r border-zinc-800 flex flex-col justify-between p-6 shrink-0 min-h-screen">
        <div>
            <div class="flex items-center gap-2 mb-10">
                <img src="image.png" alt="Logo" class="w-15 h-12">
                <div>
                    <h1 class="text-orange-400 font-bold text-sm leading-tight">CoolDowny</h1>
                    <p class="text-[10px] text-zinc-500">Equilíbrio Digital</p>
                </div>
            </div>
            <nav class="space-y-4">
                <a href="inicio.html" class="flex items-center gap-3 hover:text-orange-400 transition"><i data-lucide="home" class="w-5 h-5 text-zinc-400"></i> Início</a>
                <a href="painel.html" class="flex items-center gap-3 hover:text-orange-400 transition"><i data-lucide="layout-dashboard" class="w-5 h-5 text-zinc-400"></i> Painel</a>
                <a href="cronometro.html" class="flex items-center gap-3 hover:text-orange-400 transition"><i data-lucide="timer" class="w-5 h-5 text-zinc-400"></i> Cronômetro</a>
                <a href="tarefas.html" class="flex items-center gap-3 text-orange-400 font-medium transition"><i data-lucide="list-todo" class="w-5 h-5 text-orange-400"></i> Tarefas</a>
                <a href="relatorios.html" class="flex items-center gap-3 hover:text-orange-400 transition"><i data-lucide="bar-chart-3" class="w-5 h-5 text-zinc-400"></i> Relatórios</a>
            </nav>
        </div>
        <div class="border-t border-zinc-800 pt-4">
            <a id="loginLink" href="login.html" class="flex items-center gap-3 font-semibold text-white hover:text-orange-400 transition">
                <i data-lucide="user" class="w-6 h-6 p-1 bg-zinc-800 rounded-full"></i> Login
            </a>
        </div>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
        <div class="max-w-2xl mx-auto">
            <div class="mb-8">
                <h1 class="text-4xl font-bold text-white mb-2">Tarefas do Dia</h1>
                <p class="text-zinc-400">Complete suas responsabilidades antes de jogar</p>
            </div>

            <div class="bg-[#1A1615] border border-zinc-800 rounded-2xl p-6 mb-6">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-white font-semibold">Progresso do dia</h2>
                    <span id="tarefas-realizadas" class="text-amber-400 font-bold text-lg">0/0</span>
                </div>
                <div class="w-full bg-zinc-800 rounded-full h-3">
                    <div id="barra-progresso" class="bg-amber-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <div class="bg-[#1A1615] border border-zinc-800 rounded-2xl p-6 mb-6">
                <h2 class="text-white font-semibold mb-4">Nova Tarefa</h2>
                <div class="flex gap-3">
                    <input type="text" id="input-tarefas" placeholder="O que precisa fazer?">
                    <button id="btn-adicionar" class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-5 py-2 rounded-xl transition cursor-pointer whitespace-nowrap">
                        + Adicionar
                    </button>
                </div>
            </div>

            <div class="bg-[#1A1615] border border-zinc-800 rounded-2xl p-6">
                <h2 class="text-white font-semibold mb-4">Lista de Tarefas</h2>
                <div id="mensagem-nenhuma-tarefa" class="flex flex-col items-center py-8 text-center" style="display:none!important">
                    <i data-lucide="clipboard-list" class="w-12 h-12 text-zinc-700 mb-3"></i>
                    <p class="text-zinc-500">Nenhuma tarefa encontrada</p>
                </div>
                <div id="lista-tarefas" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <script src="js/inicial.js"></script>
    <script src="js/tarefas.js"></script>
</body>
</html>
